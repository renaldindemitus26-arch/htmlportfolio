<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact me through my portfolio">
    <title>Contact - My Portfolio</title>
</head>

<body>

<header>
    <h1>My Portfolio</h1>

    <nav aria-label="Main Navigation">
       <a href="i.html">Home</a> |
        <a href="i2.html">About</a> |
        <a href="i3.html">Projects</a> |
        <a href="i4.html">Skills</a> |
        <a href="i5.html">Contact</a>
    </nav>
</header>

<main>

<section>
    <h2>Contact Me</h2>

    <p>
        Feel free to reach out to me for any project,
        collaboration or just to say hello!
    </p>

    <form action="#" method="post" aria-label="Contact Form">

        <p>
            <label for="name">Name *</label><br>
            <input
                type="text"
                id="name"
                name="name"
                required
                autocomplete="name">
        </p>

        <p>
            <label for="email">Email *</label><br>
            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email">
        </p>

        <p>
            <label for="message">Message *</label><br>
            <textarea
                id="message"
                name="message"
                rows="6"
                required></textarea>
        </p>

        <button type="submit">Send Message</button>

    </form>
</section>

</main>

<footer>
    <p>&copy; 2026 My Portfolio. All Rights Reserved.</p>
    <a href="#top">Back to Top</a>
</footer>

</body>
</html>
